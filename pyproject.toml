[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphapulse"
version = "2.0.0"
description = "Multi-Model Deep Learning Stock Intelligence & Quantitative Forecasting Engine"
authors = [
    { name = "AlphaPulse Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "yfinance>=0.2.40",
    "ta>=0.11.0",
    "arch>=7.0.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "torchinfo>=1.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]

