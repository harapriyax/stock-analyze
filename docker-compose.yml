version: "3.8"

services:
  alphapulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alphapulse-ai
    ports:
      - "8501:8501"
    volumes:
      # Persist models, datasets, and experiment logs on host machine
      - ./data:/app/data
      - ./models:/app/models
      - ./datasets:/app/datasets
      - ./results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
